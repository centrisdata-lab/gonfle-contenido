<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Copiar texto</title>
<style>*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,sans-serif;background:#fff;color:#1e1630}
#b{position:fixed;left:0;right:0;top:0;height:45vh;border:0;background:#eb0045;color:#fff;font:700 34px system-ui,sans-serif}
#b.ok{background:#15803d}#t{margin:47vh 0 0;padding:16px 18px 40px;white-space:pre-wrap}#n{padding:0 18px;color:#6b6878;font-size:14px}</style></head>
<body><button id="b">Copiar texto</button><div id="t"></div><div id="n"></div>
<script>
const T = {"2026-11-12-reel-valorados": "Tu equipo lo dio todo este año. Que el detalle de fin de año esté a la altura: regalos armados a tu gusto y un brunch para celebrar juntos.\n\nCotiza por WhatsApp: enlace en el perfil.\n\n#bienestarlaboral #regaloscorporativos #talentohumano #findeaño #medellin", "2026-11-13-carrusel-venta": "Cotiza hoy por WhatsApp las anchetas y cajas de regalo de fin de año para tu empresa: enlace en el perfil, escríbenos la palabra REGALOS.\n\nRegalos corporativos personalizados con tu marca, para empleados y clientes, con entrega en Medellín. Más de 10 años acompañando a las empresas.\n\n#anchetasmedellin #regaloscorporativos #anchetasempresariales #cajasderegalo #regalosdefindeaño", "2026-11-16-reel-fin-de-ano": "¿Diciembre te va a coger otra vez sin los regalos del equipo? Anchetas, cajas de regalo y brunch para la fiesta, armados a tu medida y a tu presupuesto.\n\nPide tu cotización por WhatsApp: enlace en el perfil.\n\n#regaloscorporativos #anchetas #findeaño #brunch #medellin", "2026-11-18-carrusel-errores": "El regalo de fin de año de tu empresa no se retrasa por el proveedor: casi siempre se retrasa por decisiones que nadie tomó a tiempo. En este carrusel te dejamos los 5 errores más comunes al pedir regalos corporativos y una lista para evitarlos.\n\nGuárdalo para tu planeación y envíaselo a quien aprueba el presupuesto. Si necesitas anchetas o cajas de regalo para tu empresa en Medellín, escríbenos por WhatsApp desde el enlace del perfil.\n\n#regaloscorporativos #regalosempresariales #talentohumano #anchetasmedellin #medellin", "2026-11-20-reel-corre-corre": "Faltan 3 días para la fiesta y los regalos del equipo siguen sin pedir. Este año, pídelo con tiempo: anchetas, cajas de regalo y brunch para la fiesta, a tu medida y a tu presupuesto.\n\nPide tu cotización por WhatsApp: enlace en el perfil.\n\n#regaloscorporativos #anchetas #findeaño #brunch #medellin", "2026-11-23-carrusel-proceso": "Así trabajamos un pedido de regalos corporativos, desde tu primer mensaje hasta la entrega en tu empresa. Cinco pasos, un solo contacto y nada que tengas que perseguir.\n\nSi estás comparando proveedores de anchetas y cajas de regalo para empresas en Medellín, guarda este carrusel y revísalo con tu equipo. Para cotizar, escríbenos por WhatsApp desde el enlace del perfil.\n\n#regaloscorporativos #cajasderegalo #regalosempresariales #compras #medellin", "2026-11-25-reel-un-solo-aliado": "¿Cinco proveedores para una sola fiesta? Regalos, brunch, montaje e impresos con un solo aliado: una conversación, una cotización. Más de 10 años acompañando a las empresas de Medellín.\n\nPide la tuya por WhatsApp: enlace en el perfil.\n\n#eventoscorporativos #regaloscorporativos #brunch #findeaño #medellin"};
const id = new URLSearchParams(location.search).get('id');
const txt = T[id] || '';
document.getElementById('t').textContent = txt || 'No hay texto con la clave ' + id;
document.getElementById('n').textContent = id || '';
document.getElementById('b').addEventListener('click', async () => {
  const b = document.getElementById('b');
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {  // respaldo para navegadores sin permiso de portapapeles
    const a = document.createElement('textarea'); a.value = txt; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
  }
  b.textContent = 'Copiado'; b.classList.add('ok');
});
</script></body></html>
